name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm run verify:courses
      - run: npm run verify:startup
      - run: npm run verify:impact
      - run: node scripts/verify-course-schema.mjs
