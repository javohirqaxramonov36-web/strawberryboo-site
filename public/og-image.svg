<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0f15"/>
      <stop offset="1" stop-color="#161a26"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative glow -->
  <circle cx="1000" cy="120" r="260" fill="#0ea5e9" opacity="0.10"/>
  <circle cx="180" cy="540" r="220" fill="#22c55e" opacity="0.08"/>

  <!-- brand mark -->
  <g transform="translate(90,90)">
    <rect width="84" height="84" rx="22" fill="url(#brand)"/>
    <path d="M27 30 L42 54 L57 30" fill="none" stroke="#0e0f15" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="64" r="7" fill="#0e0f15"/>
  </g>

  <!-- title -->
  <text x="200" y="148" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="46" font-weight="800" fill="#ffffff">O'rganamiz</text>
  <rect x="90" y="178" width="120" height="6" rx="3" fill="url(#line)"/>

  <!-- headline -->
  <text x="90" y="300" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="74" font-weight="800" fill="#ffffff">AI, IELTS va</text>
  <text x="90" y="384" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="74" font-weight="800" fill="#ffffff">Admission <tspan fill="url(#brand)">kurslari</tspan></text>

  <!-- subtitle -->
  <text x="92" y="452" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="30" font-weight="500" fill="#aeb4c2">Amaliy, o'zbek tilida, bepul kurs ham bor.</text>

  <!-- chips -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="24" font-weight="700">
    <rect x="92" y="510" width="170" height="56" rx="28" fill="#0ea5e9" opacity="0.15"/>
    <text x="126" y="546" fill="#7dd3fc">Prompt Eng</text>
    <rect x="282" y="510" width="150" height="56" rx="28" fill="#22c55e" opacity="0.15"/>
    <text x="312" y="546" fill="#86efac">IELTS</text>
    <rect x="452" y="510" width="200" height="56" rx="28" fill="#0ea5e9" opacity="0.15"/>
    <text x="486" y="546" fill="#7dd3fc">AI Agentlar</text>
    <rect x="672" y="510" width="220" height="56" rx="28" fill="#22c55e" opacity="0.15"/>
    <text x="706" y="546" fill="#86efac">Admission</text>
  </g>
</svg>
